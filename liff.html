<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まつぼく塾 連絡システム</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { background-color: #f0f4f8; padding: 20px; }
    .container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #00469b; margin-bottom: 20px; }
    .status-badge { text-align: center; padding: 10px; margin-bottom: 20px; border-radius: 6px; font-size: 0.9rem; background: #e3f2fd; color: #0d47a1; }
    .hidden { display: none; }
    button { width: 100%; font-weight: bold; margin-top: 20px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h2>まつぼく塾 連絡システム</h2>
    <div id="status-msg" class="status-badge">LINE連携を確認中...</div>

    <div id="register-area" class="hidden">
      <p style="font-size: 0.9rem; color: #666;">初回のみ、名簿との連携登録が必要です。</p>
      <label>学籍番号</label>
      <input type="text" id="reg-sid" placeholder="例: 2026001">
      <label>生徒氏名</label>
      <input type="text" id="reg-name" placeholder="例: 山田 太郎">
      <button onclick="onRegister()" id="reg-btn">連携を完了する</button>
    </div>

    <div id="report-area" class="hidden">
      <h3 id="welcome-msg" style="font-size: 1.1rem; color: #333;"></h3>
      <label>報告内容</label>
      <select id="status-select">
        <option value="欠席">欠席します</option>
        <option value="遅刻">遅刻します</option>
      </select>
      <label>理由・備考</label>
      <textarea id="reason" rows="4" placeholder="例：体調不良のため。15分ほど遅れます。"></textarea>
      <button onclick="onReport()" id="rep-btn">報告を送信する</button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2009685407-HKqcuQON"; 
    const GAS_URL = "★最新のGASデプロイURL★";
    let uid = "";

    liff.init({ liffId: LIFF_ID }).then(() => {
      if (!liff.isLoggedIn()) { liff.login(); }
      else { checkUser(); }
    });

    async function checkUser() {
      const profile = await liff.getProfile();
      uid = profile.userId;
      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "check_registration", lineId: uid })
      }).then(r => r.json());

      document.getElementById('status-msg').style.display = "none";
      if (res.status === "registered") {
        document.getElementById('welcome-msg').innerText = res.name + " さんの連絡";
        document.getElementById('report-area').classList.remove('hidden');
      } else {
        document.getElementById('register-area').classList.remove('hidden');
      }
    }

    async function onRegister() {
      const sid = document.getElementById('reg-sid').value.trim();
      const sname = document.getElementById('reg-name').value.trim();
      if(!sid || !sname) return alert("入力してください");
      
      const btn = document.getElementById('reg-btn');
      btn.disabled = true; btn.innerText = "名簿照合中...";

      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "register", lineId: uid, studentId: sid, studentName: sname })
      }).then(r => r.json());
      
      if(res.status === "ok") {
        alert(res.message);
        location.reload(); 
      } else {
        alert("【エラー】\n" + res.message);
        btn.disabled = false; btn.innerText = "連携を完了する";
      }
    }

    async function onReport() {
      const st = document.getElementById('status-select').value;
      const rs = document.getElementById('reason').value;
      const btn = document.getElementById('rep-btn');
      btn.disabled = true; btn.innerText = "送信中...";

      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "li_report", lineId: uid, status: st, reason: rs })
      }).then(r => r.json());
      
      alert(res.message);
      if(res.status === "ok") liff.closeWindow();
      else { btn.disabled = false; btn.innerText = "報告を送信する"; }
    }
  </script>
</body>
</html>
