<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まつぼく塾 連絡システム</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { background-color: #f0f4f8; padding: 20px; }
    .container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #00469b; margin-bottom: 20px; }
    .status-badge { text-align: center; padding: 10px; margin-bottom: 20px; border-radius: 6px; font-size: 0.9rem; background: #e3f2fd; color: #0d47a1; }
    .hidden { display: none; }
    button { width: 100%; font-weight: bold; margin-top: 10px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    label { font-weight: bold; margin-top: 15px; display: block; }
    input, select, textarea { width: 100%; margin-bottom: 10px; }
    .error-text { color: #d32f2f; font-size: 0.85rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>まつぼく塾 連絡システム</h2>
    
    <div id="status-msg" class="status-badge">LINE連携を初期化中...</div>

    <!-- 1. 新規連携エリア -->
    <div id="register-area" class="hidden">
      <p style="font-size: 0.9rem; color: #666;">初回のみ、名簿との連携登録が必要です。</p>
      <label>学籍番号</label>
      <input type="text" id="reg-sid" placeholder="例: S101">
      <label>生徒氏名</label>
      <input type="text" id="reg-name" placeholder="例: 佐藤 健太郎">
      <button onclick="onRegister()" id="reg-btn">連携を完了する</button>
    </div>

    <!-- 2. 報告エリア -->
    <div id="report-area" class="hidden">
      <h3 id="welcome-msg" style="font-size: 1.1rem; color: #333; border-left: 4px solid #00469b; padding-left: 10px;"></h3>
      <label>報告内容</label>
      <select id="status-select">
        <option value="欠席">欠席します</option>
        <option value="遅刻">遅刻します</option>
      </select>
      <label>理由・備考</label>
      <textarea id="reason" rows="4" placeholder="例：体調不良のため。15分ほど遅れます。"></textarea>
      <button onclick="onReport()" id="rep-btn">報告を送信する</button>
    </div>
  </div>

  <script>
    // --- 最新のURLに書き換え済み ---
    const LIFF_ID = "2009685567-Xmto9X08"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxjB1JD1ug042H3-PM8ljgazJWyJQvW3kj3iPcujbneGw07-ojwaVuKYYiQcxTtGDFE/exec"; 
    // ---------------------------------------------------

    let uid = "";

    window.onload = function() {
      main();
    };

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return; 
        }
        const profile = await liff.getProfile();
        uid = profile.userId;
        await checkUserStatus();
      } catch (err) {
        document.getElementById('status-msg').innerHTML = `<span class="error-text">初期化エラー: ${err.message}</span>`;
      }
    }

    async function checkUserStatus() {
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "check_registration", lineId: uid })
        });
        const res = await response.json();
        document.getElementById('status-msg').classList.add('hidden');
        if (res && res.status === "registered") {
          document.getElementById('welcome-msg').innerText = `${res.name} さんの連絡`;
          document.getElementById('report-area').classList.remove('hidden');
        } else {
          document.getElementById('register-area').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('status-msg').innerHTML = `<span class="error-text">通信エラーが発生しました。</span>`;
      }
    }

    async function onRegister() {
      const sid = document.getElementById('reg-sid').value.trim();
      const sname = document.getElementById('reg-name').value.trim();
      if (!sid || !sname) { alert("学籍番号と氏名を入力してください。"); return; }
      
      const btn = document.getElementById('reg-btn');
      btn.disabled = true;
      btn.innerText = "照合中...";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ 
            action: "register", 
            lineId: uid, 
            studentId: sid, 
            studentName: sname 
          })
        });
        const res = await response.json();
        if (res.status === "ok") {
          alert(res.message); 
          location.reload();
        } else {
          alert("照合失敗：\n" + res.message); 
          btn.disabled = false;
          btn.innerText = "連携を完了する";
        }
      } catch (e) {
        alert("エラーが発生しました。再度お試しください。");
        btn.disabled = false;
        btn.innerText = "連携を完了する";
      }
    }

    async function onReport() {
      const st = document.getElementById('status-select').value;
      const rs = document.getElementById('reason').value.trim();
      const btn = document.getElementById('rep-btn');
      btn.disabled = true;
      btn.innerText = "送信中...";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ 
            action: "li_report", 
            lineId: uid, 
            status: st, 
            reason: rs 
          })
        });
        const res = await response.json();
        if (res.status === "ok") {
          alert(res.message);
          liff.closeWindow();
        } else {
          alert("送信失敗: " + res.message);
          btn.disabled = false;
          btn.innerText = "報告を送信する";
        }
      } catch (e) {
        alert("通信に失敗しました。");
        btn.disabled = false;
        btn.innerText = "報告を送信する";
      }
    }
  </script>
</body>
</html>
